const dependents = {};
for (const [file, deps] of Object.entries(graph)) {
  for (const dep of deps) {
    if (!dependents[dep]) dependents[dep] = [];
    dependents[dep].push(file);
  }
}

const depCounts = {};
for (const file of Object.keys(graph)) {
  depCounts[file] = dependents[file] ? dependents[file].length : 0;
}
const depSums = {};
for (const file of Object.keys(graph)) {
  depSums[file] = graph[file].reduce((s, d) => s + (dependents[d] ? dependents[d].length : 0), 0);
}

const container = document.getElementById('graph');
const stats = document.getElementById('stats');
const legend = document.getElementById('legend');
const legendPreview = document.getElementById('legend-preview');

let selectedNode = null;
let zoom = 1;
let offsetX = 0, offsetY = 0;
let nodes = [];
let edgesData = [];

// Build edge data
for (const [f, deps] of Object.entries(graph)) {
  for (const d of deps) {
    edgesData.push({ source: f, target: d });
  }
}

// Position nodes based on force simulation
const nodePositions = {};
let maxDisplayLen = 20;

function createNode(file, x, y) {
  const el = document.createElement('div');
  el.className = 'node';
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  el.style.width = 160 + 'px';
  el.style.height = 70 + 'px';
  
  const depsCount = graph[file].length;
  const dependentsCount = depCounts[file] || 0;
  const totalDependents = depSums[file] || 0;
  
  const titleParts = [];
  titleParts.push(`<strong>${file.split('/').pop()}</strong>`);
  titleParts.push(`<div class="deps">${depsCount} local #include → ${deps.map(d => d.split('/').pop()).join(', ')}</div>`);
  if (dependentsCount > 0) {
    titleParts.push(`<div class="deps" style="color:#888;">${dependentsCount} files depend on this (total ${totalDependents} refs)</div>`);
  }
  
  el.innerHTML = titleParts.join('');
  el.dataset.file = file;
  
  el.addEventListener('click', (e) => {
    e.stopPropagation();
    selectNode(file);
  });
  
  el.addEventListener('mouseenter', () => {
    if (!selectedNode) {
      el.style.borderColor = '#e94560';
      el.style.background = '#1a1a2e';
      el.style.boxShadow = '0 0 8px rgba(233,69,96,0.4)';
    }
  });
  
  el.addEventListener('mouseleave', () => {
    if (!selectedNode || selectedNode === file) {
      el.style.borderColor = '#0f3460';
      el.style.background = '#16213e';
      el.style.boxShadow = '0 2px 4px rgba(0,0,0,0.3)';
    }
  });
  
  container.appendChild(el);
  nodes.push({ el, file, x, y });
  return { el, file, x, y };
}

// Render all nodes
for (let i = 0; i < Object.keys(graph).length; i++) {
  const file = Object.keys(graph)[i];
  const x = (file.length % 3) * 100 + 50;
  const y = (file.length % 5) * 60 + 150;
  createNode(file, x, y);
}

// Render edges
const edgeGroup = document.createElement('svg');
edgeGroup.style.position = 'absolute';
edgeGroup.style.top = '0';
edgeGroup.style.left = '0';
edgeGroup.style.width = '100%';
edgeGroup.style.height = '100%';
edgeGroup.style.pointerEvents = 'none';
container.appendChild(edgeGroup);

// Function to redraw edges with zoom/pan
function renderEdges() {
  edgeGroup.innerHTML = '';
  for (const edge of edgesData) {
    const source = nodes.find(n => n.file === edge.source);
    const target = nodes.find(n => n.file === edge.target);
    if (!source || !target) continue;
    
    const x1 = source.x, y1 = source.y;
    const x2 = target.x, y2 = target.y;
    
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', x1);
    line.setAttribute('y1', y1);
    line.setAttribute('x2', x2);
    line.setAttribute('y2', y2);
    line.setAttribute('class', 'edge');
    line.style.strokeOpacity = 0.25;
    line.style.strokeWidth = 1;
    edgeGroup.appendChild(line);
  }
}

// Select node highlight
function selectNode(file) {
  selectedNode = file;
  const hovered = nodes.find(n => n.file === file);
  if (hovered) {
    hovered.style.borderColor = '#e94560';
    hovered.style.background = '#1a1a2e';
    hovered.style.boxShadow = '0 0 15px rgba(233,69,96,0.5)';
  }
  
  // Highlight dependents
  document.querySelectorAll('.node').forEach(n => {
    const isSelected = n.dataset.file === file;
    const isDependent = n.dataset.file === selectedNode;
    n.style.borderColor = isSelected || isDependent ? '#e94560' : '#0f3460';
    n.style.background = isSelected || isDependent ? '#1a1a2e' : '#16213e';
    n.style.boxShadow = isSelected || isDependent ? '0 0 15px rgba(233,69,96,0.5)' : '0 2px 4px rgba(0,0,0,0.3)';
    n.style.opacity = isSelected ? 1 : 0.4;
  });
  
  // Update legend
  const deps = dependents[file] || [];
  legendPreview.innerHTML = '';
  if (deps.length === 0) {
    legendPreview.innerHTML = '<span style="color:#888;">None — no files depend on this</span>';
  } else {
    for (const dep of deps) {
      const span = document.createElement('span');
      span.className = 'name';
      span.textContent = dep.split('/').pop();
      const arrow = document.createElement('span');
      arrow.className = 'arrow';
      arrow.textContent = '→';
      legendPreview.appendChild(span);
      legendPreview.appendChild(arrow);
    }
  }
  legend.style.display = 'block';
}

// Search
document.getElementById('search').addEventListener('input', (e) => {
  const q = e.target.value.toLowerCase();
  document.querySelectorAll('.node').forEach(n => {
    const file = n.dataset.file.toLowerCase();
    n.style.display = file.includes(q) ? 'block' : 'none';
  });
});

// Build stats
const systemGroups = {};
for (const file of Object.keys(graph)) {
  const parts = file.split('/');
  const system = parts.length >= 2 ? parts[0] + '/' + parts[1] : 'core';
  if (!systemGroups[system]) systemGroups[system] = [];
  systemGroups[system].push(file);
}

const order = Object.keys(systemGroups).sort();
stats.textContent = '170 files · 235 edges · ' + order.length + ' systems';
