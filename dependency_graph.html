const dependents = {};
for (const [file, deps] of Object.entries(graph)) {
  for (const dep of deps) {
    if (!dependents[dep]) dependents[dep] = [];
    dependents[dep].push(file);
  }
}

const depCounts = {};
for (const file of Object.keys(graph)) {
  depCounts[file] = dependents[file] ? dependents[file].length : 0;
}

const container = document.getElementById('graph');
const stats = document.getElementById('stats');

function nodeSize(count) {
  return Math.max(60, Math.min(280, 60 + count * 3));
}

function createNode(file, x, y) {
  const div = document.createElement('div');
  div.className = 'node';
  div.style.left = x + 'px';
  div.style.top = y + 'px';
  div.style.width = nodeSize(depCounts[file]) + 'px';
  div.innerHTML = `
    <div class="file" title="${file}">${file.split('/').pop()}</div>
    <div class="deps">${graph[file].length} local #include${graph[file].length !== 1 ? 's' : ''}</div>
    <div class="count">${depCounts[file]} dependent${depCounts[file] !== 1 ? 's' : ''}</div>
  `;
  div.dataset.file = file;

  div.addEventListener('click', () => {
    document.querySelectorAll('.node').forEach(n => {
      n.style.borderColor = n.dataset.file === file ? '#e94560' : '#0f3460';
      n.style.background = n.dataset.file === file ? '#1a1a2e' : '#16213e';
      n.style.boxShadow = n.dataset.file === file ? '0 0 15px rgba(233,69,96,0.4)' : 'none';
    });
  });

  container.appendChild(div);
  return div;
}

const systems = {};
for (const file of Object.keys(graph)) {
  const parts = file.split('/');
  const system = parts.length >= 2 ? parts[0] + '/' + parts[1] : 'core';
  if (!systems[system]) systems[system] = [];
  systems[system].push(file);
}

const order = Object.keys(systems).sort();

for (let si = 0; si < order.length; si++) {
  const system = order[si];
  const files = systems[system].sort((a, b) => {
    return depCounts[b] - depCounts[a];
  });
  const bandY = 80 + si * 70;
  const colCount = Math.ceil(Math.sqrt(files.length));
  for (let fi = 0; fi < files.length; fi++) {
    const file = files[fi];
    const col = fi % colCount;
    const row = Math.floor(fi / colCount);
    const x = 40 + col * 110;
    const y = bandY + row * 65;
    createNode(file, x, y);
  }
}

stats.textContent = '170 files · 235 edges · ' + order.length + ' systems';
document.getElementById('search').addEventListener('input', (e) => {
  const q = e.target.value.toLowerCase();
  document.querySelectorAll('.node').forEach(n => {
    const file = n.dataset.file.toLowerCase();
    n.style.display = file.includes(q) ? 'block' : 'none';
  });
});
</script>
